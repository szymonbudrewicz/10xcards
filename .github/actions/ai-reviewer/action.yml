# AI Reviewer — composite action that runs the 10xCards review agent (packages/code-reviewer)
# on a PR diff. Based on the M5L3 course template, adapted: the agent runs from this repo via
# `npm run review` (no dist/ build) and reads OPENROUTER_API_KEY.
# It never fails the job: it reports the verdict, or why there is none, so the workflow can
# comment in both cases. The merge gate is the workflow's last step and reads only `verdict`.
name: AI Reviewer
description: Run the 10xCards code review agent on a pull request diff

inputs:
  api-key:
    description: OpenRouter API key (empty on PRs from forks — reported as reason=missing_key)
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-body:
    description: Pull request description (costs tokens; criterion 5 judges it)
    required: false
    default: ""
  diff-file:
    description: Absolute path to a file with the PR diff (a file avoids step-output size and newline limits)
    required: true
  model:
    description: OpenRouter model id passed to the reviewer
    required: false
    # Same default as the CLI; chosen by the promptfoo evals (context/changes/code-review-evals/results.md).
    default: openai/gpt-6-luna

outputs:
  verdict:
    description: Binding verdict (pass|fail), empty when the run produced none
    value: ${{ steps.agent.outputs.verdict }}
  reason:
    description: Why there is no verdict (missing_key|provider_error|limit|invalid_output), empty otherwise
    value: ${{ steps.agent.outputs.reason }}
  exit-code:
    description: Exit code of the reviewer CLI (0 review, 1 setup/provider error, 2 limit)
    value: ${{ steps.agent.outputs.exit-code }}
  review-file:
    description: Path to the full JSON review (valid only when verdict is set)
    value: ${{ steps.agent.outputs.review-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: packages/code-reviewer/package-lock.json

    - name: Install reviewer
      shell: bash
      # Runtime only: devDependencies (promptfoo, vitest, typescript) are for local evals and tests.
      run: npm ci --omit=dev --prefix "$GITHUB_WORKSPACE/packages/code-reviewer" --no-audit --no-fund

    - name: Run agent
      id: agent
      shell: bash
      # Untrusted PR text goes through env, never interpolated into the script.
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        DIFF_FILE: ${{ inputs.diff-file }}
        REVIEW_MODEL: ${{ inputs.model }}
      run: |
        review_file="$RUNNER_TEMP/ai-review.json"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"

        if [ -z "$OPENROUTER_API_KEY" ]; then
          echo "::error::Brak OPENROUTER_API_KEY (sekret repozytorium; PR-y z forków go nie dostają)"
          { echo "exit-code=1"; echo "reason=missing_key"; } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The CLI prints the review JSON on stdout; usage, [verdict] and [limit] go to the log.
        set +e
        npm run review --silent --prefix "$GITHUB_WORKSPACE/packages/code-reviewer" -- "$DIFF_FILE" > "$review_file"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        case "$code" in
          0)
            if verdict=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!["pass", "fail"].includes(r.verdict)) process.exit(1); console.log(r.verdict)' "$review_file"); then
              echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
              echo "AI review verdict: $verdict"
            else
              echo "::error::Recenzent nie zwrócił poprawnego werdyktu"
              echo "reason=invalid_output" >> "$GITHUB_OUTPUT"
            fi
            ;;
          2)
            echo "::error::Recenzję zatrzymał limit przebiegu (REVIEW_MAX_*)"
            echo "reason=limit" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Recenzent zakończył się kodem $code (błąd konfiguracji lub dostawcy modelu)"
            echo "reason=provider_error" >> "$GITHUB_OUTPUT"
            ;;
        esac
